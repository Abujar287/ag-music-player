name: Build & Release AG Music Player APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Auto-Version, Sign & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Semantic Version
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag --list "V-*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.1"
          else
            RAW_VER="${LATEST_TAG#V-}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi

          IFS='.' read -r V_MAJ V_MIN V_PAT <<< "$NEXT_VERSION"
          VERSION_CODE=$((V_MAJ * 10000 + V_MIN * 100 + V_PAT))
          TAG_NAME="V-${NEXT_VERSION}"
          APK_NAME="AG Music Player ${TAG_NAME}.apk"

          echo "version_name=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

          echo "Latest tag: ${LATEST_TAG:-none}"
          echo "Next release: ${TAG_NAME} (versionCode: ${VERSION_CODE})"
          echo "Target APK: ${APK_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Release Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not found. Generating temporary keystore for build verification."
            keytool -genkeypair -v \
              -keystore android/app/release-keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'agmusicplayer' }}" \
              -alias "${{ secrets.KEY_ALIAS || 'agmusic' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'agmusicplayer' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AG Music Player, O=Abujar287, C=US"
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'agmusicplayer' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'agmusic' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'agmusicplayer' }}
        run: |
          cd android
          gradle assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon

      - name: Rename Signed APK
        run: |
          mkdir -p release-output
          APK_SOURCE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Signed release APK not found!"
            exit 1
          fi
          cp "$APK_SOURCE" "release-output/${{ steps.version.outputs.apk_name }}"
          ls -lh "release-output/${{ steps.version.outputs.apk_name }}"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: release-output/${{ steps.version.outputs.apk_name }}

      - name: Clean Up Keystore
        if: always()
        run: rm -f android/app/release-keystore.jks

      - name: Create Git Tag & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "AG Music Player ${{ steps.version.outputs.tag_name }}"
          body: |
            ## AG Music Player ${{ steps.version.outputs.tag_name }}

            - **Version Name:** `${{ steps.version.outputs.version_name }}`
            - **Version Code:** `${{ steps.version.outputs.version_code }}`
            - **APK Asset:** `${{ steps.version.outputs.apk_name }}`
            - **Commit:** `${{ github.sha }}`

            ### Highlights
            - Offline-first high-contrast audio player with 5-band Equalizer & Virtualizer
            - In-app GitHub Auto-Updater via `DownloadManager` + `FileProvider`
            - Preserves playlists, favorites, and custom tags across updates
          draft: false
          prerelease: false
          files: |
            release-output/${{ steps.version.outputs.apk_name }}
